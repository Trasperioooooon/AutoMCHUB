name: Test

# 在真正的 Windows 上跑 Go 测试（云端开发时只能借 wine 跑）。前端交互测试见 tools/ui-dev。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Go 测试
        run: go test ./...
