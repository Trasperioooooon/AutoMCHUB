<script>
/* 外观需在样式表生效前落到 <html>，避免首帧闪烁。三项偏好均存 localStorage（每台设备各自记忆）：
   amh_theme = auto | light | dark（auto 解析为系统色）；amh_scheme = 配色方案；amh_accent = 强调色（auto=跟随方案）。
   优先级：URL 参数 > 记忆 > 默认。 */
(function () {
  var SCHEMES = ["craft", "fluent", "github", "graphite", "nord", "catppuccin", "solarized"];
  var ACCENTS = ["auto", "blue", "indigo", "violet", "teal", "green", "orange", "rose", "graphite"];
  var q = new URLSearchParams(location.search);
  var get = function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
  var pref = q.get("theme") || get("amh_theme", "auto");
  var scheme = q.get("scheme") || get("amh_scheme", "craft");
  var accent = q.get("accent") || get("amh_accent", "auto");
  if (["auto", "light", "dark"].indexOf(pref) < 0) pref = "auto";
  if (SCHEMES.indexOf(scheme) < 0) scheme = "craft";
  if (ACCENTS.indexOf(accent) < 0) accent = "auto";
  var sys = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  var root = document.documentElement;
  root.dataset.themePref = pref;
  root.dataset.theme = pref === "auto" ? sys : pref;
  root.dataset.scheme = scheme;
  root.dataset.accent = accent;
  /* 启动画面：只在原生 WebView2 窗口里（宿主注入了 hostWin* 桥接函数）、本次进程启动后第一次加载页面时播放。
     宿主每次启动生成一个 ID（window.__MD_BOOT，由 WebView2 的文档创建脚本注入，刷新后不变），
     sessionStorage 记下播过的 ID：刷新页面不再播；从托盘恢复窗口不会重新加载页面，也不播；
     局域网浏览器访问没有宿主函数，不播。系统开启「减少动态」时直接跳过。 */
  try {
    var boot = window.__MD_BOOT;
    if (typeof window.hostWinClose === "function" && boot && sessionStorage.getItem("md_boot") !== boot &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      sessionStorage.setItem("md_boot", boot);
      root.dataset.splash = "play";
    }
  } catch (e) {}
})();
</script>

<body>
<div id="splash" role="status" aria-label="MineDeck 正在启动"><div class="splash-inner"><div class="splash-logo" id="splash-logo"></div><div class="splash-word">MineDeck</div><div class="splash-bar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="splash-skip">点击任意处或按任意键跳过</div></div>
<script>
/* 启动画面：应用图标（16×16 像素网格）拆成 64 个 2×2 的方块，自下而上逐行落下（单块 200ms，逐行错峰 34ms），
   字标随后进场，下方 8 格进度按节奏点亮。界面就绪（app.js 派发 md-ready）且方块拼完（0.76 秒）后淡出，
   整体封顶约 1 秒；点击或按任意键立即跳过（按键不会再触发 1–4 等快捷键）。 */
(function () {
  var root = document.documentElement, sp = document.getElementById("splash");
  if (!root.dataset.splash) { sp.remove(); return; }
  var PAL = "5b7b31 6cbf3a 282d34 1d2127 4c9a2c 3a7a22 4a5260 363c47 1a1e24 272c34 8dff6a 434b58".split(" ");
  var PX = ".......aa............aabbaa........aabbbbbbaa....aabbbbbbbbbbaa.cbbbbbbbbbbbbbbdceebbbbbbbbbbffdcggeebbbbbbffhhdcggggeebbffhhhhdciiggggefhhhhhhdcgiiiggghhhhhjjdcgggiikglhhjjhhdcgggggkilhjhhhhd.ccggggglhhhhdd....ccggglhhdd........ccgldd............cd.......";
  var html = "";
  for (var i = 0; i < 256; i++) {
    var c = PX.charAt(i), x = i % 16, y = i >> 4;
    html += c === "." ? "<i></i>" : '<i style="background:#' + PAL[c.charCodeAt(0) - 97] + ";--d:" + ((7 - (y >> 1)) * 34 + (x >> 1) * 6) + 'ms"></i>';
  }
  document.getElementById("splash-logo").innerHTML = html;
  var t0 = Date.now(), ready = false, done = false, timers = [];
  var segs = sp.querySelectorAll(".splash-bar i");
  for (var n = 0; n < segs.length; n++) timers.push(setTimeout((function (s) { return function () { s.className = "on"; }; })(segs[n]), 90 + n * 80));
  function finish(fast) {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    document.removeEventListener("keydown", onKey, true);
    sp.className = "leave" + (fast ? " fast" : "");
    var main = document.getElementById("main");
    if (main) { main.classList.remove("view-enter"); void main.offsetWidth; main.classList.add("view-enter"); }
    setTimeout(function () { sp.remove(); delete root.dataset.splash; }, fast ? 120 : 200);
  }
  function onKey(e) { e.preventDefault(); e.stopPropagation(); finish(true); }
  sp.addEventListener("click", function () { finish(true); });
  document.addEventListener("keydown", onKey, true);
  document.addEventListener("md-ready", function () { ready = true; if (Date.now() - t0 >= 760) finish(false); });
  timers.push(setTimeout(function () { if (ready) finish(false); }, 760));
  setTimeout(function () { finish(false); }, 1000);
})();
</script>
